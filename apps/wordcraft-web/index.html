<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>WordCraft</title>
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #e6e6e6; }
    #wordcraft_host { position: absolute; inset: 0; height: 100%; height: 100dvh; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #wordcraft_canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    /* eframe positions its invisible keyboard input at the caret. A second tap must reach
       the canvas there; the input still receives focus and keyboard/IME events normally. */
    #wordcraft_host > input { pointer-events: none; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="wordcraft_host"><canvas id="wordcraft_canvas"></canvas></div>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
